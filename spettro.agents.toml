[[agents]]
id = 'plan'
name = 'Plan'
description = 'Planning orchestrator that coordinates workers and todo state. Pure orchestrator: cannot read files directly — must delegate all discovery to the explore worker.'
skill = 'planning'
mode = 'orchestrator'
role = 'orchestrator'
color = 'purple'
model_provider = ''
model = ''
system_prompt = ''
prompt_file = 'agents/planning.md'
allowed_tools = ['agent', 'tool-search', 'todo-write', 'task-stop', 'config', 'ask-user', 'enter-plan-mode', 'exit-plan-mode', 'send-message', 'comment', 'skill']
permitted_actions = ['read', 'search', 'plan', 'write', 'ask']
permission = 'ask-first'
permission_rules = []
temperature = 0.2
max_tokens = 4096
max_steps = 0
handoffs = ['explore', 'review', 'docs', 'general-purpose']
enabled = true

