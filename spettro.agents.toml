version = 14
default_agent = 'plan'

[metadata]
name = 'Spettro workspace agents'
description = 'Lean orchestrator/worker setup for Spettro.'

[runtime]
default_permission = 'ask-first'
default_timeout_sec = 120
log_tool_calls = true
sandbox_mode = 'full-access'
permission_rules = []
allow_network_tools = false

[runtime.delegation]
max_parallel_workers = 4
max_depth = 2
max_tool_calls_per_step = 32

[runtime.fallback]
mode = 'prompt'

