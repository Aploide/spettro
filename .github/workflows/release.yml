name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Ship the current model catalog as the embedded offline fallback. A
      # catalog outage keeps the committed snapshot rather than failing the
      # release.
      - name: Refresh embedded model catalog
        run: go generate ./internal/models || echo "::warning::catalog download failed; keeping the committed snapshot"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="spettro_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          # Windows ships spettro.exe in a .zip: Windows has no bundled
          # tar-aware unpacker for a hand-download, and internal/update picks
          # its unpacker from the same per-OS convention.
          BINARY=spettro
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=spettro.exe
          fi
          # The release build flags are defined once, in the Makefile.
          make release-binary VERSION="${VERSION}" OUT="${BINARY}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "${ARCHIVE_NAME}.zip" "${BINARY}"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" "${BINARY}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spettro_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        # Both archive kinds go in one checksums.txt: install.sh, install.ps1
        # and internal/update all look their own asset up by name.
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
